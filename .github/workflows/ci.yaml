name: Build and publish to devpi

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVPI_SERVER: https://stablekite.com:4438/
  DEVPI_TARGET_INDEX: https://stablekite.com:4438/StableKite/index/

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14t
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Compile Python sources
        run: python -m compileall -q airsim

      - name: Verify VCS dependency is reachable
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote \
            https://github.com/StableKite/msgpack-rpc-python.git \
            HEAD >/dev/null
          echo "msgpack-rpc-python repository is reachable"

      - name: Ensure sdist contains external build inputs
        shell: bash
        run: |
          set -euo pipefail

          touch MANIFEST.in

          for entry in \
            "include README.md" \
            "include LICENSE" \
            "include VERSION.txt" \
            "include requirements.txt" \
            "include pyproject.toml" \
            "recursive-include airsim *.py"
          do
            grep -qxF "$entry" MANIFEST.in || printf '%s\n' "$entry" >> MANIFEST.in
          done

          echo "Effective MANIFEST.in:"
          cat MANIFEST.in

      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist --outdir dist

      - name: Verify distributions
        shell: bash
        run: |
          python - <<'PY'
          from email.parser import BytesParser
          from email.policy import default
          from pathlib import Path
          import os
          import re
          import tarfile
          import zipfile

          version = Path("VERSION.txt").read_text(encoding="utf-8").strip()
          expected_wheel = f"airsim-{version}-py3-none-any.whl"
          expected_sdist = f"airsim-{version}.tar.gz"

          dist = Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))

          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one wheel, got: {wheels}")
          if len(sdists) != 1:
              raise SystemExit(f"Expected exactly one sdist, got: {sdists}")

          wheel = wheels[0]
          sdist = sdists[0]

          if wheel.name != expected_wheel:
              raise SystemExit(
                  f"Unexpected wheel filename: {wheel.name}; "
                  f"expected {expected_wheel}"
              )
          if sdist.name != expected_sdist:
              raise SystemExit(
                  f"Unexpected sdist filename: {sdist.name}; "
                  f"expected {expected_sdist}"
              )

          required_package_files = {
              "airsim/__init__.py",
              "airsim/client.py",
              "airsim/pfm.py",
              "airsim/types.py",
              "airsim/utils.py",
              "airsim/version.py",
          }

          with zipfile.ZipFile(wheel) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f"Corrupt wheel member: {bad}")

              names = set(archive.namelist())
              missing = sorted(required_package_files - names)
              if missing:
                  raise SystemExit(f"Wheel is missing files: {missing}")

              wheel_metadata_name = next(
                  name for name in names
                  if name.endswith(".dist-info/WHEEL")
              )
              package_metadata_name = next(
                  name for name in names
                  if name.endswith(".dist-info/METADATA")
              )

              wheel_metadata = archive.read(
                  wheel_metadata_name
              ).decode("utf-8")

              if "Root-Is-Purelib: true" not in wheel_metadata:
                  raise SystemExit("Wheel is not marked as pure Python")
              if "Tag: py3-none-any" not in wheel_metadata:
                  raise SystemExit(
                      "Wheel does not contain py3-none-any tag"
                  )

              metadata = BytesParser(policy=default).parsebytes(
                  archive.read(package_metadata_name)
              )

              if metadata["Name"].lower() != "airsim":
                  raise SystemExit(
                      f"Unexpected package name: {metadata['Name']!r}"
                  )
              if metadata["Version"] != version:
                  raise SystemExit(
                      f"Unexpected package version: {metadata['Version']!r}"
                  )

              requirements = metadata.get_all("Requires-Dist", [])
              normalized = {
                  requirement.replace(" ", "").lower()
                  for requirement in requirements
              }

              required_dependencies = {
                  "numpy",
                  "opencv-python",
                  (
                      "msgpack-rpc-python@"
                      "git+https://github.com/stablekite/"
                      "msgpack-rpc-python.git"
                  ),
              }

              missing_requirements = sorted(
                  dependency
                  for dependency in required_dependencies
                  if dependency not in normalized
              )
              if missing_requirements:
                  raise SystemExit(
                      "Wheel metadata is missing dependencies "
                      f"{missing_requirements}; got {requirements!r}"
                  )

              version_py = archive.read(
                  "airsim/version.py"
              ).decode("utf-8")

              if f'__version__ = "{version}"' not in version_py:
                  raise SystemExit(
                      "Generated airsim/version.py has unexpected version"
                  )

              match = re.search(
                  r'__gitsha__ = "([0-9a-f]{7})"',
                  version_py,
              )
              if match is None:
                  raise SystemExit(
                      "Generated airsim/version.py does not contain "
                      "a 7-character git SHA"
                  )

              github_sha = os.environ.get("GITHUB_SHA", "")
              if github_sha and match.group(1) != github_sha[:7]:
                  raise SystemExit(
                      "Generated git SHA does not match the workflow commit: "
                      f"{match.group(1)} != {github_sha[:7]}"
                  )

          with tarfile.open(sdist, "r:gz") as archive:
              names = archive.getnames()

          required_sdist_suffixes = (
              "/setup.py",
              "/pyproject.toml",
              "/README.md",
              "/LICENSE",
              "/VERSION.txt",
              "/requirements.txt",
              "/airsim/__init__.py",
              "/airsim/client.py",
              "/airsim/pfm.py",
              "/airsim/types.py",
              "/airsim/utils.py",
              "/airsim/version.py",
          )

          for suffix in required_sdist_suffixes:
              if not any(name.endswith(suffix) for name in names):
                  raise SystemExit(
                      f"Source distribution is missing: {suffix}"
                  )

          print("Artifacts:")
          print(f"  {wheel.name} ({wheel.stat().st_size} bytes)")
          print(f"  {sdist.name} ({sdist.stat().st_size} bytes)")
          PY

      - name: Verify sdist can rebuild the wheel
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '\r\n' < VERSION.txt)"

          rm -rf sdist-check rebuilt-wheel
          mkdir -p sdist-check rebuilt-wheel

          tar -xzf "dist/airsim-${VERSION}.tar.gz" -C sdist-check

          mapfile -t roots < <(
            find sdist-check -mindepth 1 -maxdepth 1 -type d -print
          )

          if [ "${#roots[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one sdist root directory."
            exit 1
          fi

          python -m build \
            --wheel \
            --outdir rebuilt-wheel \
            "${roots[0]}"

          mapfile -t rebuilt < <(
            find rebuilt-wheel -maxdepth 1 -type f -name '*.whl' -print
          )

          if [ "${#rebuilt[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one wheel rebuilt from sdist."
            exit 1
          fi

          EXPECTED="airsim-${VERSION}-py3-none-any.whl"
          if [ "$(basename "${rebuilt[0]}")" != "$EXPECTED" ]; then
            echo "::error::Unexpected rebuilt wheel: ${rebuilt[0]}"
            exit 1
          fi

          echo "Successfully rebuilt from sdist: ${rebuilt[0]}"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error


  test:
    name: Test / ${{ matrix.target }}
    needs: build

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux x86_64
            runner: ubuntu-24.04

          - target: Linux aarch64
            runner: ubuntu-24.04-arm

          - target: Windows x86_64
            runner: windows-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist

      - name: Set up Python 3.14t
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"

      - name: Install test dependency
        run: python -m pip install --upgrade "numpy>=2"

      - name: Install built wheel
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t wheels < <(
            find dist -maxdepth 1 -type f -name '*.whl' -print
          )

          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one wheel, found ${#wheels[@]}."
            exit 1
          fi

          # OpenCV and msgpack-rpc are intentionally not installed here.
          # The smoke test stubs only those external modules so we can test
          # AirSim's own package on CPython 3.14t without requiring a simulator,
          # camera stack, or a second VCS package build.
          python -m pip install \
            --force-reinstall \
            --no-deps \
            "${wheels[0]}"

      - name: Smoke-test package
        shell: bash
        run: |
          python - <<'PY'
          import math
          import sys
          import sysconfig
          import tempfile
          import types
          from pathlib import Path

          import numpy as np

          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1

          # Minimal cv2 stub for importing airsim.utils. The CI does not test
          # OpenCV itself; it tests the AirSim Python package.
          cv2 = types.ModuleType("cv2")
          cv2.imwrite = lambda filename, image: True

          cv2_typing = types.ModuleType("cv2.typing")
          cv2_typing.MatLike = object
          cv2.typing = cv2_typing

          sys.modules["cv2"] = cv2
          sys.modules["cv2.typing"] = cv2_typing

          # Minimal msgpackrpc stub for importing airsim.client without opening
          # sockets or requiring the external msgpack-rpc implementation.
          msgpackrpc = types.ModuleType("msgpackrpc")
          msgpackrpc_future = types.ModuleType("msgpackrpc.future")

          class Future:
              pass

          class Address:
              def __init__(self, host, port):
                  self.host = host
                  self.port = port

          class Client:
              def __init__(self, address, **kwargs):
                  self.address = address
                  self.kwargs = kwargs

              def call(self, *args, **kwargs):
                  raise AssertionError(
                      "Smoke test must not make an RPC call"
                  )

          msgpackrpc.Address = Address
          msgpackrpc.Client = Client
          msgpackrpc_future.Future = Future

          sys.modules["msgpackrpc"] = msgpackrpc
          sys.modules["msgpackrpc.future"] = msgpackrpc_future

          import airsim
          from airsim.client import VehicleClient
          from airsim.pfm import read_pfm, write_pfm
          from airsim.types import Quaternionr, Vector3r
          from airsim.utils import to_eularian_angles, to_quaternion
          from airsim.version import __version__, __gitsha__

          assert __version__
          assert len(__gitsha__) == 7

          vector = Vector3r(1.0, 2.0, 3.0)
          assert tuple(vector) == (1.0, 2.0, 3.0)
          assert vector.to_msgpack() == {
              "x_val": 1.0,
              "y_val": 2.0,
              "z_val": 3.0,
          }

          restored = Vector3r.from_msgpack(
              {"x_val": 4.0, "y_val": 5.0, "z_val": 6.0}
          )
          assert tuple(restored) == (4.0, 5.0, 6.0)

          quaternion = Quaternionr(
              x_val=0.0,
              y_val=0.0,
              z_val=0.0,
              w_val=1.0,
          )
          assert math.isclose(quaternion.get_length(), 1.0)

          q = to_quaternion(0.0, 0.0, 0.0)
          roll, pitch, yaw = to_eularian_angles(q)
          assert math.isclose(q.w_val, 1.0)
          assert math.isclose(roll, 0.0, abs_tol=1e-12)
          assert math.isclose(pitch, 0.0, abs_tol=1e-12)
          assert math.isclose(yaw, 0.0, abs_tol=1e-12)

          client = VehicleClient(
              ip="192.0.2.1",
              port=41451,
              timeout_value=17,
              reconnect_limit=3,
          )
          assert isinstance(client.client, Client)
          assert client.client.address.host == "192.0.2.1"
          assert client.client.address.port == 41451
          assert client.client.kwargs["timeout"] == 17
          assert client.client.kwargs["reconnect_limit"] == 3
          assert client.get_client_version() == 1
          assert client.get_min_required_server_version() == 1

          # The current AirSim write_pfm() implementation only marks the
          # payload as little-endian when dtype.byteorder is "<" or "|".
          # NumPy normalizes native little-endian float32 to byteorder "=",
          # which would make write_pfm() emit a positive scale while writing
          # little-endian data. That is a project bug unrelated to packaging.
          # Use explicit big-endian float32 here so the CI smoke test validates
          # PFM I/O without depending on that known endian-marker issue.
          image = np.array(
              [[1.0, 2.0], [3.0, 4.0]],
              dtype=">f4",
          )

          with tempfile.TemporaryDirectory() as tmp:
              filename = Path(tmp) / "test.pfm"
              write_pfm(str(filename), image)
              restored_image, scale = read_pfm(str(filename))

          assert scale == 1.0
          assert np.array_equal(restored_image, image)

          print("AirSim wheel smoke-test OK")
          print("Installed from:", airsim.__file__)
          print("Version:", __version__)
          print("Git SHA:", __gitsha__)
          PY


  publish:
    name: Publish to devpi
    needs:
      - build
      - test

    runs-on: ubuntu-24.04

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify downloaded artifacts
        shell: bash
        run: |
          python - <<'PY'
          from email.parser import BytesParser
          from email.policy import default
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))

          if len(wheels) != 1:
              raise SystemExit(
                  f"Expected exactly one wheel, got: {wheels}"
              )
          if len(sdists) != 1:
              raise SystemExit(
                  f"Expected exactly one sdist, got: {sdists}"
              )

          wheel = wheels[0]
          sdist = sdists[0]

          if not wheel.name.startswith("airsim-"):
              raise SystemExit(f"Unexpected wheel filename: {wheel.name}")
          if not wheel.name.endswith("-py3-none-any.whl"):
              raise SystemExit(f"Unexpected wheel tag: {wheel.name}")

          with zipfile.ZipFile(wheel) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(
                      f"Corrupt wheel member: {bad}"
                  )

              metadata_name = next(
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              )
              metadata = BytesParser(policy=default).parsebytes(
                  archive.read(metadata_name)
              )

          version = metadata["Version"]
          if metadata["Name"].lower() != "airsim":
              raise SystemExit(
                  f"Unexpected package name: {metadata['Name']!r}"
              )

          expected_sdist = f"airsim-{version}.tar.gz"
          if sdist.name != expected_sdist:
              raise SystemExit(
                  f"Unexpected sdist filename: {sdist.name}; "
                  f"expected {expected_sdist}"
              )

          with tarfile.open(sdist, "r:gz") as archive:
              archive.getmembers()

          print("Ready to publish:")
          print(f"  {wheel.name} ({wheel.stat().st_size} bytes)")
          print(f"  {sdist.name} ({sdist.stat().st_size} bytes)")
          PY

      - name: Install devpi tools
        run: >-
          python -m pip install
          devpi-client
          devpi-tokens
          "pypitoken>=6.0.1"

      - name: Publish
        env:
          DEVPI_TOKEN: ${{ secrets.DEVPI_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DEVPI_TOKEN:-}" ]; then
            echo "::error::DEVPI_TOKEN is not available to this repository."
            exit 1
          fi

          TOKEN_FILE="$RUNNER_TEMP/devpi-token"
          printf '%s' "$DEVPI_TOKEN" > "$TOKEN_FILE"
          chmod 600 "$TOKEN_FILE"
          trap 'rm -f "$TOKEN_FILE"' EXIT

          devpi use "$DEVPI_SERVER"
          devpi token-login -f "$TOKEN_FILE"
          devpi use "$DEVPI_TARGET_INDEX"
          devpi upload dist/*
