name: Build and publish to devpi

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVPI_SERVER: https://stablekite.com:4438/
  DEVPI_TARGET_INDEX: https://stablekite.com:4438/StableKite/index/
  AIRSIM_VERSION: "2.0.2"

jobs:
  windows-package:
    name: Windows x86_64 / source package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14t
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"

      - name: Install build and smoke dependencies
        run: >-
          python -m pip install --upgrade
          build
          wheel
          "numpy>=2"

      - name: Compile Python sources
        run: python -m compileall -q airsim ci_wheel_smoke.py

      - name: Verify VCS dependency is reachable
        shell: pwsh
        run: |
          git ls-remote `
            https://github.com/StableKite/msgpack-rpc-python.git `
            HEAD | Out-Null

          if ($LASTEXITCODE -ne 0) {
            throw "msgpack-rpc-python repository is not reachable."
          }

      - name: Prepare source manifest
        shell: pwsh
        run: |
          $Entries = @(
            "include README.md"
            "include LICENSE"
            "include VERSION.txt"
            "include requirements.txt"
            "include pyproject.toml"
            "recursive-include airsim *.py"
          )

          [System.IO.File]::WriteAllLines(
            (Join-Path $PWD "MANIFEST.in"),
            $Entries,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Build wheel and source distribution on Windows
        run: python -m build --wheel --sdist --outdir dist

      - name: Verify Windows-built distributions
        shell: pwsh
        run: |
          @'
          from email.parser import BytesParser
          from email.policy import default
          from pathlib import Path
          import os
          import re
          import tarfile
          import zipfile

          version = os.environ["AIRSIM_VERSION"]
          dist = Path("dist")
          wheel = dist / f"airsim-{version}-py3-none-any.whl"
          sdist = dist / f"airsim-{version}.tar.gz"

          actual_wheels = list(dist.glob("*.whl"))
          actual_sdists = list(dist.glob("*.tar.gz"))

          if actual_wheels != [wheel]:
              raise SystemExit(
                  f"Unexpected Windows wheel set: {actual_wheels}"
              )
          if actual_sdists != [sdist]:
              raise SystemExit(
                  f"Unexpected Windows sdist set: {actual_sdists}"
              )

          required_package_files = {
              "airsim/__init__.py",
              "airsim/client.py",
              "airsim/pfm.py",
              "airsim/types.py",
              "airsim/utils.py",
              "airsim/version.py",
          }

          with zipfile.ZipFile(wheel) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f"Corrupt wheel member: {bad}")

              names = set(archive.namelist())
              missing = sorted(required_package_files - names)
              if missing:
                  raise SystemExit(
                      f"Wheel is missing files: {missing}"
                  )

              wheel_metadata_name = next(
                  name
                  for name in names
                  if name.endswith(".dist-info/WHEEL")
              )
              package_metadata_name = next(
                  name
                  for name in names
                  if name.endswith(".dist-info/METADATA")
              )

              wheel_metadata = archive.read(
                  wheel_metadata_name
              ).decode("utf-8")

              if "Root-Is-Purelib: true" not in wheel_metadata:
                  raise SystemExit(
                      "Wheel is not marked as pure Python"
                  )
              if "Tag: py3-none-any" not in wheel_metadata:
                  raise SystemExit(
                      "Wheel does not contain py3-none-any tag"
                  )

              metadata = BytesParser(
                  policy=default
              ).parsebytes(
                  archive.read(package_metadata_name)
              )

              if metadata["Name"].lower() != "airsim":
                  raise SystemExit(
                      f"Unexpected package name: {metadata['Name']!r}"
                  )
              if metadata["Version"] != version:
                  raise SystemExit(
                      f"Unexpected version: {metadata['Version']!r}"
                  )

              requirements = metadata.get_all("Requires-Dist", [])
              normalized = {
                  requirement.replace(" ", "").lower()
                  for requirement in requirements
              }

              required_dependencies = {
                  "numpy",
                  "opencv-python",
                  (
                      "msgpack-rpc-python@"
                      "git+https://github.com/stablekite/"
                      "msgpack-rpc-python.git"
                  ),
              }

              missing_requirements = sorted(
                  dependency
                  for dependency in required_dependencies
                  if dependency not in normalized
              )
              if missing_requirements:
                  raise SystemExit(
                      "Wheel metadata is missing dependencies "
                      f"{missing_requirements}; got "
                      f"{requirements!r}"
                  )

              version_py = archive.read(
                  "airsim/version.py"
              ).decode("utf-8")

          if f'__version__ = "{version}"' not in version_py:
              raise SystemExit(
                  "Generated airsim/version.py has wrong version"
              )

          match = re.search(
              r'__gitsha__ = "([0-9a-f]{7})"',
              version_py,
          )
          if match is None:
              raise SystemExit(
                  "Generated version.py lacks a 7-char git SHA"
              )

          github_sha = os.environ.get("GITHUB_SHA", "")
          if github_sha and match.group(1) != github_sha[:7]:
              raise SystemExit(
                  "Generated git SHA does not match workflow commit: "
                  f"{match.group(1)} != {github_sha[:7]}"
              )

          with tarfile.open(sdist, "r:gz") as archive:
              names = archive.getnames()

          required_sdist_suffixes = (
              "/setup.py",
              "/pyproject.toml",
              "/README.md",
              "/LICENSE",
              "/VERSION.txt",
              "/requirements.txt",
              "/airsim/__init__.py",
              "/airsim/client.py",
              "/airsim/pfm.py",
              "/airsim/types.py",
              "/airsim/utils.py",
              "/airsim/version.py",
          )

          for suffix in required_sdist_suffixes:
              if not any(
                  name.endswith(suffix)
                  for name in names
              ):
                  raise SystemExit(
                      f"Source distribution is missing: {suffix}"
                  )

          print(f"Windows wheel OK: {wheel.name}")
          print(f"Windows sdist OK: {sdist.name}")
          '@ | python -

      - name: Rebuild wheel from Windows-built sdist
        shell: pwsh
        run: |
          $SdistRoot = Join-Path $env:RUNNER_TEMP "airsim-sdist"
          $Rebuilt = Join-Path $env:RUNNER_TEMP "airsim-rebuilt"

          Remove-Item `
            -LiteralPath $SdistRoot `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            -LiteralPath $Rebuilt `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path $SdistRoot | Out-Null
          New-Item -ItemType Directory -Path $Rebuilt | Out-Null

          tar -xzf "dist/airsim-$env:AIRSIM_VERSION.tar.gz" `
            -C $SdistRoot

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract Windows-built sdist."
          }

          $Roots = @(
            Get-ChildItem -LiteralPath $SdistRoot -Directory
          )

          if ($Roots.Count -ne 1) {
            throw "Expected exactly one sdist root."
          }

          python -m build `
            --wheel `
            --outdir $Rebuilt `
            $Roots[0].FullName

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to rebuild wheel from sdist."
          }

          $Wheels = @(
            Get-ChildItem -LiteralPath $Rebuilt -Filter "*.whl"
          )

          if (
            $Wheels.Count -ne 1 -or
            $Wheels[0].Name -ne
              "airsim-$env:AIRSIM_VERSION-py3-none-any.whl"
          ) {
            throw "Unexpected wheel rebuilt from Windows sdist."
          }

          python -m pip install `
            --force-reinstall `
            --no-deps `
            $Wheels[0].FullName

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install rebuilt Windows wheel."
          }

      - name: Smoke-test installed Windows wheel
        shell: pwsh
        run: |
          $SmokeDir = Join-Path $env:RUNNER_TEMP "airsim-smoke"

          Remove-Item `
            -LiteralPath $SmokeDir `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path $SmokeDir | Out-Null

          Copy-Item `
            -LiteralPath "ci_wheel_smoke.py" `
            -Destination (Join-Path $SmokeDir "ci_wheel_smoke.py")

          Push-Location $SmokeDir
          try {
            python ci_wheel_smoke.py `
              "$env:AIRSIM_VERSION" `
              --require-free-threaded

            if ($LASTEXITCODE -ne 0) {
              throw "Windows installed-wheel smoke failed."
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload Windows-built distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error


  linux-glibc:
    name: Linux glibc ${{ matrix.arch }} / source build

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14t
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"

      - name: Verify native architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Install build and smoke dependencies
        run: >-
          python -m pip install --upgrade
          build
          wheel
          "numpy>=2"

      - name: Prepare source manifest
        shell: bash
        run: |
          cat > MANIFEST.in <<'EOF'
          include README.md
          include LICENSE
          include VERSION.txt
          include requirements.txt
          include pyproject.toml
          recursive-include airsim *.py
          EOF

      - name: Build wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q airsim ci_wheel_smoke.py
          python -m build \
            --wheel \
            --sdist \
            --outdir platform-dist

      - name: Verify and rebuild glibc distributions
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import os
          import tarfile
          import zipfile

          version = os.environ["AIRSIM_VERSION"]
          dist = Path("platform-dist")
          expected_wheel = (
              dist / f"airsim-{version}-py3-none-any.whl"
          )
          expected_sdist = (
              dist / f"airsim-{version}.tar.gz"
          )

          if list(dist.glob("*.whl")) != [expected_wheel]:
              raise SystemExit(
                  f"Unexpected wheel set: {list(dist.glob('*.whl'))}"
              )
          if list(dist.glob("*.tar.gz")) != [expected_sdist]:
              raise SystemExit(
                  "Unexpected sdist set: "
                  f"{list(dist.glob('*.tar.gz'))}"
              )

          with zipfile.ZipFile(expected_wheel) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(
                      f"Corrupt wheel member: {bad}"
                  )
              wheel_metadata_name = next(
                  name
                  for name in archive.namelist()
                  if name.endswith(".dist-info/WHEEL")
              )
              wheel_metadata = archive.read(
                  wheel_metadata_name
              ).decode("utf-8")

          if "Tag: py3-none-any" not in wheel_metadata:
              raise SystemExit("Wheel is not universal")

          with tarfile.open(expected_sdist, "r:gz") as archive:
              archive.getmembers()

          print("glibc source artifacts OK")
          PY

          rm -rf sdist-check rebuilt-wheel
          mkdir -p sdist-check rebuilt-wheel

          tar -xzf \
            "platform-dist/airsim-${AIRSIM_VERSION}.tar.gz" \
            -C sdist-check

          mapfile -t roots < <(
            find sdist-check \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print
          )

          if [ "${#roots[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one sdist root."
            exit 1
          fi

          python -m build \
            --wheel \
            --outdir rebuilt-wheel \
            "${roots[0]}"

          mapfile -t rebuilt < <(
            find rebuilt-wheel \
              -maxdepth 1 \
              -type f \
              -name '*.whl' \
              -print
          )

          if [ "${#rebuilt[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one rebuilt wheel."
            exit 1
          fi

          if [ "$(basename "${rebuilt[0]}")" != "airsim-${AIRSIM_VERSION}-py3-none-any.whl" ]; then
            echo "::error::Unexpected rebuilt wheel: ${rebuilt[0]}"
            exit 1
          fi

          python -m pip install \
            --force-reinstall \
            --no-deps \
            "${rebuilt[0]}"

      - name: Smoke-test installed glibc wheel
        shell: bash
        run: |
          set -euo pipefail

          smoke_dir="$RUNNER_TEMP/airsim-smoke"
          rm -rf "$smoke_dir"
          mkdir -p "$smoke_dir"
          cp ci_wheel_smoke.py "$smoke_dir/"

          (
            cd "$smoke_dir"
            python ci_wheel_smoke.py \
              "$AIRSIM_VERSION" \
              --require-free-threaded
          )


  linux-musl:
    name: Linux musl ${{ matrix.arch }} / source build

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build, rebuild, install and test in native Alpine
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_VERSION: ${{ env.AIRSIM_VERSION }}
        run: |
          set -euo pipefail

          alpine_script="$RUNNER_TEMP/airsim-musl.sh"

          cat > "$alpine_script" <<'ALPINE'
          #!/bin/sh
          set -eux

          apk add --no-cache git

          python -m pip install --upgrade \
            pip \
            build \
            wheel \
            "numpy>=2"

          test "$(uname -m)" = "$EXPECTED_ARCH"

          mkdir -p /work
          cp -a /src/. /work/
          cd /work

          git config --global --add safe.directory /work
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_GIT_SHA"

          cat > MANIFEST.in <<'EOF'
          include README.md
          include LICENSE
          include VERSION.txt
          include requirements.txt
          include pyproject.toml
          recursive-include airsim *.py
          EOF

          python -m compileall -q \
            airsim \
            ci_wheel_smoke.py

          python -m build \
            --wheel \
            --sdist \
            --outdir platform-dist

          python - <<'PY'
          from pathlib import Path
          import os
          import tarfile
          import zipfile

          version = os.environ["EXPECTED_VERSION"]
          dist = Path("platform-dist")
          wheel = dist / f"airsim-{version}-py3-none-any.whl"
          sdist = dist / f"airsim-{version}.tar.gz"

          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))

          if wheels != [wheel]:
              raise SystemExit(
                  f"Unexpected musl wheel set: {wheels}"
              )
          if sdists != [sdist]:
              raise SystemExit(
                  f"Unexpected musl sdist set: {sdists}"
              )

          with zipfile.ZipFile(wheel) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(
                      f"Corrupt wheel member: {bad}"
                  )
              wheel_metadata_name = next(
                  name
                  for name in archive.namelist()
                  if name.endswith(".dist-info/WHEEL")
              )
              wheel_metadata = archive.read(
                  wheel_metadata_name
              ).decode("utf-8")

          if "Tag: py3-none-any" not in wheel_metadata:
              raise SystemExit(
                  "Musl-built wheel is not universal"
              )

          with tarfile.open(sdist, "r:gz") as archive:
              archive.getmembers()

          print("musl source artifacts OK")
          PY

          rm -rf sdist-check rebuilt-wheel
          mkdir -p sdist-check rebuilt-wheel

          tar -xzf \
            "platform-dist/airsim-${EXPECTED_VERSION}.tar.gz" \
            -C sdist-check

          root="$(
            find sdist-check \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print
          )"

          test -n "$root"
          test "$(
            find sdist-check \
              -mindepth 1 \
              -maxdepth 1 \
              -type d |
              wc -l
          )" -eq 1

          python -m build \
            --wheel \
            --outdir rebuilt-wheel \
            "$root"

          rebuilt="$(
            find rebuilt-wheel \
              -maxdepth 1 \
              -type f \
              -name "*.whl" \
              -print
          )"

          test -n "$rebuilt"
          test "$(
            find rebuilt-wheel \
              -maxdepth 1 \
              -type f \
              -name "*.whl" |
              wc -l
          )" -eq 1

          test "$(basename "$rebuilt")" = \
            "airsim-${EXPECTED_VERSION}-py3-none-any.whl"

          python -m pip install \
            --force-reinstall \
            --no-deps \
            "$rebuilt"

          smoke_dir=/tmp/airsim-smoke
          rm -rf "$smoke_dir"
          mkdir -p "$smoke_dir"
          cp ci_wheel_smoke.py "$smoke_dir/"

          cd "$smoke_dir"
          python ci_wheel_smoke.py "$EXPECTED_VERSION"
          ALPINE

          chmod +x "$alpine_script"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$alpine_script:/tmp/airsim-musl.sh:ro" \
            -e EXPECTED_ARCH \
            -e EXPECTED_VERSION \
            -e EXPECTED_GIT_SHA="$GITHUB_SHA" \
            python:3.14-alpine \
            sh /tmp/airsim-musl.sh


  publish:
    name: Publish platform-validated artifacts to devpi

    needs:
      - windows-package
      - linux-glibc
      - linux-musl

    runs-on: ubuntu-24.04

    steps:
      - name: Download Windows-built distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify publish artifacts
        shell: bash
        run: |
          python - <<'PY'
          from email.parser import BytesParser
          from email.policy import default
          from pathlib import Path
          import os
          import tarfile
          import zipfile

          version = os.environ["AIRSIM_VERSION"]
          dist = Path("dist")
          wheel = dist / f"airsim-{version}-py3-none-any.whl"
          sdist = dist / f"airsim-{version}.tar.gz"

          if list(dist.glob("*.whl")) != [wheel]:
              raise SystemExit(
                  f"Unexpected publish wheel set: {list(dist.glob('*.whl'))}"
              )
          if list(dist.glob("*.tar.gz")) != [sdist]:
              raise SystemExit(
                  f"Unexpected publish sdist set: {list(dist.glob('*.tar.gz'))}"
              )

          with zipfile.ZipFile(wheel) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(
                      f"Corrupt wheel member: {bad}"
                  )

              wheel_metadata_name = next(
                  name
                  for name in archive.namelist()
                  if name.endswith(".dist-info/WHEEL")
              )
              metadata_name = next(
                  name
                  for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              )

              wheel_metadata = archive.read(
                  wheel_metadata_name
              ).decode("utf-8")
              metadata = BytesParser(
                  policy=default
              ).parsebytes(
                  archive.read(metadata_name)
              )

          if "Root-Is-Purelib: true" not in wheel_metadata:
              raise SystemExit("Publish wheel is not pure Python")
          if "Tag: py3-none-any" not in wheel_metadata:
              raise SystemExit("Publish wheel is not universal")
          if metadata["Name"].lower() != "airsim":
              raise SystemExit(
                  f"Unexpected package name: {metadata['Name']!r}"
              )
          if metadata["Version"] != version:
              raise SystemExit(
                  f"Unexpected version: {metadata['Version']!r}"
              )

          with tarfile.open(sdist, "r:gz") as archive:
              archive.getmembers()

          print("Ready to publish:")
          print(f"  {wheel.name} ({wheel.stat().st_size} bytes)")
          print(f"  {sdist.name} ({sdist.stat().st_size} bytes)")
          PY

      - name: Install publish tools
        run: >-
          python -m pip install
          twine
          devpi-client
          devpi-tokens

      - name: Twine check
        run: python -m twine check dist/*

      - name: Publish
        env:
          DEVPI_TOKEN: ${{ secrets.DEVPI_TOKEN }}
          DEVPI_CLIENTDIR: ${{ runner.temp }}/devpi-client
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DEVPI_TOKEN:-}" ]; then
            echo "::error::DEVPI_TOKEN is not available."
            exit 1
          fi

          TOKEN_FILE="$RUNNER_TEMP/devpi-token"
          printf '%s' "$DEVPI_TOKEN" > "$TOKEN_FILE"
          chmod 600 "$TOKEN_FILE"

          cleanup() {
            rm -f "$TOKEN_FILE"
            rm -rf "$DEVPI_CLIENTDIR"
          }
          trap cleanup EXIT

          devpi use "$DEVPI_SERVER"
          devpi token-login -f "$TOKEN_FILE"
          devpi use "$DEVPI_TARGET_INDEX"
          devpi upload dist/*
